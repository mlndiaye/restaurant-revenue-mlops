name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Run preprocessing to generate datasets
        run: PYTHONPATH=src uv run python src/restaurant_revenue/features/preprocessing.py

      - name: Train model (best_model.pkl required for API tests)
        run: PYTHONPATH=src uv run python src/restaurant_revenue/models/train.py

      - name: Run pytest
        run: PYTHONPATH=src uv run pytest tests/
