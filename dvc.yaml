stages:
  load_data:
    cmd: PYTHONPATH=src uv run python src/restaurant_revenue/data/download.py
    deps:
      - src/restaurant_revenue/data/download.py
      - src/restaurant_revenue/data/load.py
    outs:
      - data/raw/train.csv
      - data/raw/test.csv
  preprocess:
    cmd: PYTHONPATH=src uv run python src/restaurant_revenue/features/preprocessing.py
    deps:
      - src/restaurant_revenue/features/preprocessing.py
      - data/raw/train.csv
      - data/raw/test.csv
    outs:
      - data/processed/train_processed.csv
      - data/processed/test_processed.csv
  train:
    cmd: PYTHONPATH=src uv run python src/restaurant_revenue/models/train.py
    deps:
      - src/restaurant_revenue/models/train.py
      - data/processed/train_processed.csv
    outs:
      - models/best_model.pkl
  evaluate:
    cmd: PYTHONPATH=src uv run python src/restaurant_revenue/models/evaluate.py
    deps:
      - src/restaurant_revenue/models/evaluate.py
      - models/best_model.pkl
      - data/processed/train_processed.csv
    metrics:
      - metrics.json:
          cache: false
