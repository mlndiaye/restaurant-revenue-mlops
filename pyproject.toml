[project]
name = "restaurant-revenue-mlops"
version = "0.1.0"
description = "Restaurant revenue prediction MLOps project for TFI"
requires-python = ">=3.12"
dependencies = [
    "pandas==2.2.3",
    "numpy==2.2.6",
    "matplotlib==3.10.3",
    "seaborn==0.13.2",
    "ipykernel>=7.2.0",
    "pandas-stubs~=2.2.3",
]

[dependency-groups]
dev = [
    "kagglehub==1.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]
